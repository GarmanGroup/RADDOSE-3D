name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8 is what the released jar targets; 21 proves the suite survives a
        # modern JDK. That split is exactly what rotted last time: the Travis
        # job compiled without a -source/-target pin while releases used 1.8.
        java: ['8', '21']

    steps:
      - uses: actions/checkout@v5
        with:
          # build.xml runs `git rev-list --count HEAD` at PARSE time, before
          # any target, so the full history must be present. The old
          # .travis.yml needed `git: depth: false` for the same reason.
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Compile
        run: ant build build-tests

      - name: Test
        run: ant test-all

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-java${{ matrix.java }}
          path: reports/tests/
          if-no-files-found: warn
